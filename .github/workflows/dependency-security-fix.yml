name: Verify locked dependency security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reviewed lockfiles
        run: |
          npm ci
          npm ci --prefix backend
      - name: Fail on unresolved dependency advisories
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix backend --audit-level=moderate
      - name: Validate reviewed application
        run: |
          npm run build
          npm test --prefix backend
          npm run test:customer-bookings
          npm run test:customer-auth
          npm run test:inquiries
          npm run test:staff
          npm run test:receipt-retry
          npm run test:website-presentation
