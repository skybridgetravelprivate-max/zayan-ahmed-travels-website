name: Dependency security verification

on:
  push:
    branches:
      - agents/connect-travel-website-backend
    paths:
      - package.json
      - package-lock.json
      - backend/package.json
      - backend/package-lock.json
      - .github/workflows/dependency-security-fix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agents/connect-travel-website-backend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        run: npm ci --legacy-peer-deps

      - name: Install backend dependencies
        run: npm ci --prefix backend --legacy-peer-deps

      - name: Verify root dependency audit
        run: npm audit --audit-level=moderate --legacy-peer-deps

      - name: Verify backend dependency audit
        run: npm audit --prefix backend --audit-level=moderate --legacy-peer-deps

      - name: Build website and API
        run: npm run build

      - name: Run backend tests
        run: npm test --prefix backend

      - name: Run customer-booking tests
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npm run test:customer-bookings
