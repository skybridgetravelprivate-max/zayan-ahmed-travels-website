name: Website and API CI

on:
  pull_request:
    branches:
      - cursor/customer-account-bookings
  push:
    branches:
      - cursor/customer-account-bookings
      - repair/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zat_synthetic
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: zat_synthetic_fullstack_20261028
        ports:
          - 55463:5432
        options: >-
          --health-cmd "pg_isready -U zat_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install website dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify root dependency audit
        run: npm audit --audit-level=moderate --legacy-peer-deps

      - name: Verify backend dependency audit
        run: npm audit --prefix backend --audit-level=moderate --legacy-peer-deps

      - name: Build website and API
        run: npm run build

      - name: Run customer-booking tests
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npm run test:customer-bookings

      - name: Verify API, customer authentication, inquiries and deployment packaging
        run: |
          npm test --prefix backend
          npm run test:customer-auth
          npm run test:inquiries
          node --test scripts/package-hostinger.spec.cjs
          npm run test:staff

      - name: Verify public presentation and durable receipt UI helpers
        run: |
          npm run test:website-presentation
          npm run test:receipt-retry

      - name: Verify isolated PostgreSQL 17 CMS and legacy administration
        env:
          DATABASE_URL: postgresql://zat_synthetic:synthetic_ci_only@127.0.0.1:55463/zat_synthetic_fullstack_20261028
          ZAT_SYNTHETIC_DATABASE_URL: postgresql://zat_synthetic:synthetic_ci_only@127.0.0.1:55463/zat_synthetic_fullstack_20261028
        run: |
          npm run db:migrate:deploy --prefix backend
          npm run test:cms:pg17 --prefix backend
          node backend/node_modules/tsx/dist/cli.mjs --tsconfig backend/apps/api/tsconfig.json --test backend/apps/api/src/admin/admin-boundaries.pg17.spec.ts
