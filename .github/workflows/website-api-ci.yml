name: Website and API CI

on:
  pull_request:
    branches:
      - cursor/customer-account-bookings
  push:
    branches:
      - agents/connect-travel-website-backend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install website dependencies
        run: npm ci --legacy-peer-deps

      - name: Build website and API
        run: npm run build

      - name: Run customer-booking tests
        run: npm run test:customer-bookings
